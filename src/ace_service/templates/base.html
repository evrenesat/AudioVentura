<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}AudioVentura{% endblock %}</title>
    <meta name="csrf-token" content="{{ csrf_token }}">
    <meta name="notifications-config" content="{{ urls.notifications_config }}">
    <meta name="notifications-subscriptions" content="{{ urls.notifications_subscriptions }}">
    <meta name="notifications-worker" content="{{ urls.notifications_worker }}">
    <meta name="offline-worker" content="{{ urls.notifications_worker }}">
    <meta name="offline-route" content="{{ urls.offline }}">
    <link rel="manifest" href="{{ urls.manifest }}">
    <link rel="stylesheet" href="{{ urls.app_css }}">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="{{ urls.dashboard }}">AudioVentura</a>
      <nav class="primary-nav" aria-label="Main navigation">
        <a data-app-nav href="{{ urls.dashboard }}">Home</a>
        <a data-app-nav href="{{ urls.sources_new }}">Create remix</a>
        <a data-app-nav href="{{ urls.library }}">Library</a>
        <a data-app-nav href="{{ urls.playlists }}">Playlists</a>
        <a data-app-nav href="{{ urls.projects }}">Projects</a>
        <a data-app-nav href="{{ urls.offline }}">Offline</a>
      </nav>
      <div class="notification-control" hidden>
        <button class="button secondary" type="button" data-notifications-enable>Enable notifications</button>
        <span class="hint" data-notifications-status hidden></span>
      </div>
    </header>
    <main id="app-main" class="container">
      {% block content %}{% endblock %}
    </main>
    {% include "_player.html" %}
    <script src="{{ urls.notifications_js }}" defer></script>
    <script src="{{ urls.player_js }}" defer></script>
    <script src="{{ urls.app_shell_js }}" defer></script>
    <script src="{{ urls.offline_store_js }}" defer></script>
    <script src="{{ urls.offline_cache_js }}" defer></script>
  </body>
</html>
