[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ace-service"
version = "0.1.0"
description = "Private ACE-Step music-generation controller"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pywebpush==2.4.0",
  "jinja2>=3.1,<4",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.30,<1",
]

[project.scripts]
ace-node = "ace_node.__main__:main"

[dependency-groups]
dev = [
  "lameenc==1.8.4",
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-playwright>=0.7,<1",
  "ruff>=0.8,<1",
  "soundfile>=0.13.1,<1",
]
node = [
  "ace-step @ git+https://github.com/ace-step/ACE-Step-1.5.git@dce621408bee8c31b4fcf4811682eb9359e1bc94; (platform_system == 'Linux' and platform_machine == 'x86_64') or (platform_system == 'Darwin' and platform_machine == 'arm64')",
  "huggingface-hub>=0.30,<1",
  "torch>=2.7; platform_system == 'Linux' and platform_machine == 'x86_64'",
  "torch>=2.7; platform_system == 'Darwin' and platform_machine == 'arm64'",
  "mlx>=0.29; platform_system == 'Darwin' and platform_machine == 'arm64'",
  "mlx-lm>=0.29; platform_system == 'Darwin' and platform_machine == 'arm64'",
  "lameenc==1.8.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ace_service", "src/ace_node", "runpod_worker"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["runpod", "runpod.*", "soundfile"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]
